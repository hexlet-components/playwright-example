name: Playwright Changed Tests
on:
  push:
    branches: [main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Force a non-shallow checkout, so that we can reference $GITHUB_BASE_REF.
          # See https://github.com/actions/checkout for more details.
          fetch-depth: 0

      - uses: jdx/mise-action@v5
      - name: Install dependencies
        run: make install
      - name: Install Playwright Browsers
        run: make install-browsers
      # Playwright зовётся напрямую, а не через `make test`: этому прогону
      # нужен аргумент --only-changed, а цель Makefile аргументы не принимает
      # и падает с «unrecognized option».
      - name: Run changed Playwright tests
        run: pnpm exec playwright test --only-changed=$GITHUB_BASE_REF
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
