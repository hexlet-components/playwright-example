name: Playwright Changed Tests
on:
  push:
    branches: [ main ]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Force a non-shallow checkout, so that we can reference $GITHUB_BASE_REF.
          # See https://github.com/actions/checkout for more details.
          fetch-depth: 0

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Install dependencies
        run: make install
      - name: Install Playwright Browsers
        run: make install-browsers
      # Playwright зовётся напрямую, а не через `make test`: этому прогону
      # нужен аргумент --only-changed, а цель Makefile аргументы не принимает
      # и падает с «unrecognized option».
      - name: Run changed Playwright tests
        run: pnpm exec playwright test --only-changed="$GITHUB_BASE_REF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
